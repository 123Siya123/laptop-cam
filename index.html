<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roboter Laptop-Kamera</title>
<style>
body{font:16px system-ui;background:#121820;color:#edf3fa;max-width:900px;margin:24px auto;padding:0 20px}
video{width:100%;max-width:640px;background:#080c10;border-radius:12px}
button{padding:12px 18px;border:0;border-radius:8px;background:#2c7698;color:white;font:inherit}
button:disabled{opacity:.5}
p{color:#bfced9}
#status{color:#fff;font-size:18px}
.warn{color:#ffb347}
</style>
</head>
<body>
<h1>Laptop-Kamera für den Roboter</h1>
<p>Diese Seite auf dem Dell-Laptop <b>offen und im Vordergrund</b> lassen.</p>
<p id="status">Bereit.</p>
<video id="cam" autoplay playsinline muted></video>
<p><button id="start">Kamera starten und senden</button></p>
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<script>
const TOPIC = 'siya-roboterarm/laptopcam/v1';
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
const status = document.getElementById('status');
const start = document.getElementById('start');
let client = null, brokerUrl = '', sent = 0, acked = 0, failed = 0, stamp = performance.now();
function show(extra) {
  status.textContent = 'Broker: ' + brokerUrl + ' | gesendet: ' + sent + ' | bestätigt: ' + acked + ' | Fehler: ' + failed + (extra ? ' | ' + extra : '');
  if (sent > acked + 5) {
    status.innerHTML += '<br><span class="warn">WARNUNG: sendet, aber der Broker bestätigt nicht – Bilder kommen NICHT an. Seite neu laden.</span>';
  }
}
start.onclick = async () => {
  start.disabled = true;
  if (!window.isSecureContext) { status.textContent = 'Braucht https.'; start.disabled = false; return; }
  if (typeof mqtt === 'undefined') { status.textContent = 'MQTT-Bibliothek (CDN) nicht geladen – Internet prüfen.'; start.disabled = false; return; }
  let lastErr = '';
  for (const url of BROKERS) {
    try {
      status.textContent = 'Verbinde ' + url + ' …';
      client = await new Promise((res, rej) => {
        const c = mqtt.connect(url, {clientId: 'dellcam-' + Math.random().toString(16).slice(2), connectTimeout: 8000, reconnectPeriod: 3000, keepalive: 30});
        c.once('connect', () => res(c));
        c.once('error', (e) => { try { c.end(true); } catch (_) {} rej(e); });
      });
      brokerUrl = url;
      break;
    } catch (e) { lastErr = e && e.message ? e.message : e; }
  }
  if (!client || !client.connected) { status.textContent = 'Keine Verbindung: ' + lastErr; start.disabled = false; return; }
  client.on('reconnect', () => { show('RECONNECT!'); });
  client.on('close', () => { show('GETRENNT!'); });
  client.on('offline', () => { show('OFFLINE!'); });
  client.on('error', (e) => { show('FEHLER: ' + (e && e.message ? e.message : e)); });
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: 'user', width: {ideal: 640}, height: {ideal: 480}}});
    const video = document.getElementById('cam');
    video.srcObject = stream;
    await video.play();
    const canvas = document.createElement('canvas');
    canvas.width = 320; canvas.height = 240;
    const ctx = canvas.getContext('2d');
    let busy = false;
    show('Kamera läuft');
    const tick = () => {
      if (!busy && video.readyState >= 2 && client.connected) {
        busy = true;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(async (blob) => {
          try {
            if (blob) {
              sent += 1;
              client.publish(TOPIC, await blob.arrayBuffer(), {qos: 1, retain: false}, (err) => {
                if (err) { failed += 1; } else { acked += 1; }
              });
            }
            const now = performance.now();
            if (now - stamp > 2000) { show(); stamp = now; }
          } catch (e) { failed += 1; show('Sendefehler: ' + e.message); }
          finally { busy = false; }
        }, 'image/jpeg', 0.65);
      }
      setTimeout(tick, 150);
    };
    tick();
  } catch (e) {
    status.textContent = 'Kamerazugriff abgelehnt: ' + e.message;
    start.disabled = false;
  }
};
</script>
</body>
</html>

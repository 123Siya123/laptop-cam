<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roboter Laptop-Kamera</title>
<style>
body{font:16px system-ui;background:#121820;color:#edf3fa;max-width:900px;margin:24px auto;padding:0 20px}
video,canvas{width:100%;max-width:640px;background:#080c10;border-radius:12px}
button{padding:12px 18px;border:0;border-radius:8px;background:#2c7698;color:white;font:inherit}
button:disabled{opacity:.5}
p{color:#bfced9}
</style>
</head>
<body>
<h1>Laptop-Kamera für den Roboter</h1>
<p>Diese Seite auf dem Dell-Laptop <b>offen lassen</b>. Das Bild läuft dann als externe Kamera auf dem Roboter-PC.</p>
<p id="status">Bereit.</p>
<video id="cam" autoplay playsinline muted></video>
<p><button id="start">Kamera starten und senden</button></p>
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<script>
const TOPIC = 'siya-roboterarm/laptopcam/v1';
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
const status = document.getElementById('status');
const start = document.getElementById('start');
let client = null;
start.onclick = async () => {
  start.disabled = true;
  if (!window.isSecureContext) { status.textContent = 'Braucht https (GitHub Pages ist ok).'; start.disabled = false; return; }
  if (typeof mqtt === 'undefined') { status.textContent = 'MQTT-Bibliothek (CDN) nicht geladen – Internet prüfen.'; start.disabled = false; return; }
  let lastErr = '';
  for (const url of BROKERS) {
    try {
      status.textContent = 'Verbinde ' + url + ' …';
      client = await new Promise((res, rej) => {
        const c = mqtt.connect(url, {clientId: 'dellcam-' + Math.random().toString(16).slice(2), connectTimeout: 8000, reconnectPeriod: 3000});
        c.once('connect', () => res(c));
        c.once('error', (e) => { try { c.end(true); } catch (_) {} rej(e); });
      });
      status.textContent = 'Verbunden über ' + url;
      break;
    } catch (e) { lastErr = e && e.message ? e.message : e; }
  }
  if (!client || !client.connected) { status.textContent = 'Keine Verbindung: ' + lastErr; start.disabled = false; return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: 'user', width: {ideal: 640}, height: {ideal: 480}}});
    const video = document.getElementById('cam');
    video.srcObject = stream;
    await video.play();
    const canvas = document.createElement('canvas');
    canvas.width = 320; canvas.height = 240;
    const ctx = canvas.getContext('2d');
    let busy = false, sent = 0, stamp = performance.now();
    status.textContent = 'Kamera läuft, sende …';
    const tick = () => {
      if (!busy && video.readyState >= 2 && client.connected) {
        busy = true;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(async (blob) => {
          try {
            if (blob) client.publish(TOPIC, await blob.arrayBuffer(), {qos: 0, retain: false});
            sent += 1;
            const now = performance.now();
            if (now - stamp > 2000) {
              status.textContent = 'Sende · ' + (sent / 2).toFixed(1) + ' Bilder/s · 320×240';
              sent = 0; stamp = now;
            }
          } catch (e) { status.textContent = 'Sendefehler: ' + e.message; }
          finally { busy = false; }
        }, 'image/jpeg', 0.65);
      }
      setTimeout(tick, 150);
    };
    tick();
  } catch (e) {
    status.textContent = 'Kamerazugriff abgelehnt: ' + e.message;
    start.disabled = false;
  }
};
</script>
</body>
</html>

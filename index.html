<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roboter Laptop-Kamera</title>
<style>
body{font:16px system-ui;background:#121820;color:#edf3fa;max-width:900px;margin:24px auto;padding:0 20px}
video{width:100%;max-width:640px;background:#080c10;border-radius:12px}
button{padding:12px 18px;border:0;border-radius:8px;background:#2c7698;color:white;font:inherit;margin:4px 4px 4px 0}
button:disabled{opacity:.5}
button.ghost{background:#3a4250}
p{color:#bfced9}
#status{color:#fff;font-size:18px}
.warn{color:#ffb347}
.ok{color:#7fd67f}
</style>
</head>
<body>
<h1>Laptop-Kamera für den Roboter</h1>
<p>Diese Seite auf dem Dell-Laptop <b>offen und im Vordergrund</b> lassen.</p>
<p id="status">Bereit.</p>
<video id="cam" autoplay playsinline muted></video>
<p>
<button id="start">Kamera starten und senden</button>
<button id="ping" class="ghost" disabled>Verbindung testen (1 Byte)</button>
<button id="broker" class="ghost" disabled>Broker wechseln</button>
<button id="small" class="ghost" disabled>Bild: groß/klein</button>
</p>
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<script>
const TOPIC = 'siya-roboterarm/laptopcam/v1';
const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
const status = document.getElementById('status');
const start = document.getElementById('start');
const pingBtn = document.getElementById('ping');
const brokerBtn = document.getElementById('broker');
const smallBtn = document.getElementById('small');
let client = null, brokerIdx = 0, brokerUrl = '';
let sent = 0, acked = 0, failed = 0, lastAck = 0, small = false;
let pingOk = null;
function show(extra) {
  const age = lastAck ? ((performance.now() - lastAck) / 1000).toFixed(0) + 's' : 'nie';
  status.innerHTML = 'Broker: ' + brokerUrl + ' | gesendet: ' + sent + ' | bestätigt: ' + acked +
    ' | Fehler: ' + failed + ' | letztes OK vor: ' + age + (extra ? '<br>' + extra : '');
  if (sent > acked + 5) {
    status.innerHTML += '<br><span class="warn">WARNUNG: sendet, aber der Broker bestätigt nicht – Bilder kommen NICHT an.</span>';
  } else if (acked > 0) {
    status.innerHTML += '<br><span class="ok">OK: Broker bestätigt, Bilder kommen an.</span>';
  }
}
function connect(url) {
  return new Promise((res, rej) => {
    const c = mqtt.connect(url, {clientId: 'dellcam-' + Math.random().toString(16).slice(2), connectTimeout: 8000, reconnectPeriod: 3000, keepalive: 15});
    c.once('connect', () => res(c));
    c.once('error', (e) => { try { c.end(true); } catch (_) {} rej(e); });
  });
}
async function connectBroker() {
  for (let k = 0; k < BROKERS.length; k++) {
    const url = BROKERS[(brokerIdx + k) % BROKERS.length];
    status.textContent = 'Verbinde ' + url + ' …';
    try {
      const c = await connect(url);
      brokerIdx = (brokerIdx + k) % BROKERS.length;
      return c;
    } catch (e) { /* naechster */ }
  }
  return null;
}
start.onclick = async () => {
  start.disabled = true;
  [pingBtn, brokerBtn, smallBtn].forEach(b => b.disabled = false);
  if (!window.isSecureContext) { status.textContent = 'Braucht https.'; return; }
  if (typeof mqtt === 'undefined') { status.textContent = 'MQTT-Bibliothek (CDN) nicht geladen.'; return; }
  client = await connectBroker();
  if (!client || !client.connected) { status.textContent = 'Keine Verbindung zu beiden Brokern.'; return; }
  brokerUrl = BROKERS[brokerIdx];
  client.on('reconnect', () => { show('RECONNECT!'); });
  client.on('close', () => { show('GETRENNT!'); });
  client.on('offline', () => { show('OFFLINE!'); });
  client.on('error', (e) => { show('FEHLER: ' + (e && e.message ? e.message : e)); });
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: 'user', width: {ideal: 640}, height: {ideal: 480}}});
    const video = document.getElementById('cam');
    video.srcObject = stream;
    await video.play();
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    let busy = false, stamp = performance.now(), degraded = false;
    show('Kamera läuft');
    const tick = () => {
      if (!busy && video.readyState >= 2 && client.connected) {
        busy = true;
        canvas.width = small ? 160 : 320;
        canvas.height = small ? 120 : 240;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(async (blob) => {
          try {
            if (blob) {
              sent += 1;
              const t0 = performance.now();
              client.publish(TOPIC, await blob.arrayBuffer(), {qos: 1, retain: false}, (err) => {
                if (err) { failed += 1; } else { acked += 1; lastAck = performance.now(); }
              });
            }
            if (!degraded && sent > 15 && acked === 0) {
              degraded = true; small = true;
              show('Auto: keine Bestätigung → schalte auf kleines Bild (160×120) um.');
            }
            const now = performance.now();
            if (now - stamp > 2000) { show(); stamp = now; }
          } catch (e) { failed += 1; }
          finally { busy = false; }
        }, 'image/jpeg', small ? 0.55 : 0.65);
      }
      setTimeout(tick, 150);
    };
    tick();
  } catch (e) { status.textContent = 'Kamerazugriff abgelehnt: ' + e.message; }
};
pingBtn.onclick = () => {
  if (!client || !client.connected) { status.textContent = 'Nicht verbunden.'; return; }
  status.textContent = 'Ping (1 Byte, QoS1) …';
  client.publish(TOPIC + '/ping', 'x', {qos: 1, retain: false}, (err) => {
    pingOk = !err;
    show('Ping-Test: ' + (pingOk ? '<span class="ok">BESTÄTIGT – Leitung ok, Problem ist die Bildgröße</span>' : '<span class="warn">NICHT bestätigt – Leitung blockiert</span>'));
  });
  setTimeout(() => { if (pingOk === null) show('Ping: keine Antwort nach 5s – Leitung blockiert'); }, 5000);
};
brokerBtn.onclick = async () => {
  try { client.end(true); } catch (_) {}
  sent = 0; acked = 0; failed = 0; lastAck = 0;
  brokerIdx = (brokerIdx + 1) % BROKERS.length;
  status.textContent = 'Wechsle Broker, Seite neu laden und Start drücken.';
};
smallBtn.onclick = () => { small = !small; show('Bildgröße: ' + (small ? '160×120' : '320×240')); };
</script>
</body>
</html>
